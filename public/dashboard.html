<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><span class="brand-mark">£</span> Ledger</div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn-ghost">Log out</button>
    </div>
  </header>

  <main class="dash-grid">
    <section class="card summary-card">
      <h2>This month</h2>
      <p class="big-number" id="month-total">£0.00</p>
      <p class="muted" id="entry-count">0 entries logged</p>
    </section>

    <section class="card form-card">
      <h2>Add an expense</h2>
      <form id="expense-form">
        <input type="hidden" name="id">
        <div class="form-row">
          <label>Amount
            <input type="number" step="0.01" min="0.01" name="amount" required placeholder="0.00">
          </label>
          <label>Date
            <input type="date" name="expense_date" required>
          </label>
        </div>
        <label>Category
          <select name="category_id" id="category-select"></select>
        </label>
        <label>Description
          <input type="text" name="description" placeholder="What was this for?">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="form-submit-btn">Add expense</button>
          <button type="button" class="btn-ghost" id="form-cancel-btn" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card chart-card">
      <h2>Spending by category</h2>
      <canvas id="category-chart" height="220"></canvas>
    </section>

    <section class="card chart-card">
      <h2>Spending over time</h2>
      <canvas id="trend-chart" height="220"></canvas>
    </section>

    <section class="card list-card">
      <div class="list-card-head">
        <h2>Recent expenses</h2>
        <select id="filter-category">
          <option value="">All categories</option>
        </select>
      </div>
      <table class="expense-table">
        <thead>
          <tr><th>Date</th><th>Category</th><th>Description</th><th class="amount-col">Amount</th><th></th></tr>
        </thead>
        <tbody id="expense-tbody"></tbody>
      </table>
      <p id="empty-state" class="muted" hidden>No expenses yet — add your first one above.</p>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
